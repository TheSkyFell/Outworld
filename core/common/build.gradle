plugins {
    id 'outworld-common'
    id 'net.neoforged.moddev'
}

// Compiles against plain vanilla Minecraft (no loader), so this code can only use vanilla APIs.
neoForge {
    neoFormVersion = neo_form_version
}

repositories {
    maven {
        name = 'Fabric'
        url = uri('https://maven.fabricmc.net/')
        content {
            includeGroup('net.fabricmc')
        }
    }
}

dependencies {
    // Both loaders ship Fabric's build of Mixin, so common code can use it. Compile-only: the loader
    // provides it at runtime.
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
}
