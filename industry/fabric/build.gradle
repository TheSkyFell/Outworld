plugins {
    id 'outworld-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // Feature mods need only Core. Its jar is on the runtime classpath, so dev runs load it as a mod.
    implementation(project(':core-fabric'))
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client (Core + Industry)')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server (Core + Industry)')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
