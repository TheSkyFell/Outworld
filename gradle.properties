group=io.github.theskyfell.outworld
java_version=25

mod_author=TheSkyFell
license=MIT
homepage=https://github.com/TheSkyFell/Outworld

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
# The vanilla code the common projects compile against: https://projects.neoforged.net/neoforged/neoform
