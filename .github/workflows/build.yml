name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (NeoForge + Fabric)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Also checks that the Gradle wrapper jar is an official one.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: outworld-jars
          path: |
            */fabric/build/libs/*.jar
            */neoforge/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error

      - name: Post the failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/report-failure.sh "Build" build.log

  server-boot:
    name: Server boot (${{ matrix.loader }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Boot a dedicated server with Core and Industry
        run: .github/scripts/boot-server.sh ${{ matrix.loader }}

      - name: Post the failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/report-failure.sh "Server boot (${{ matrix.loader }})" boot-${{ matrix.loader }}.log
